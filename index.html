<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Frontend Mentor | Ping coming soon page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      display: none;
    }

    .attribution a {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <img alt="ping-logo" src="./images/logo.svg" class="logo" />
      <h1>We are launching <span>soon!</span></h1>
      <p>Subscribe and get notified</p>
    </header>
    <div class="notify">
      <input type="email" placeholder="     Your email address..." id="email" required/>
      <p id="error"></p>
      <button type="submit" class="notify-me" id="notify-me">
        Notify Me
      </button>
   
    </div>
    <div class="content">  
      <img alt="site-preview" src="./images/illustration-dashboard.png" class="dashboard" />
      <div class="icons">
        <a href="www.facebook.com" class="icon-link"><img alt="facebook-icon" class="icon-img" src="./icons/facebook.png"></a>
        <a href="www.twitter.com" class="icon-link"><img alt="twitter-icon" class="icon-img" src="./icons/twitter.png" /></a>
        <a href="www.instagram.com" class="icon-link"><img alt="instagram-icon" class="icon-img" src="./icons/instagram.png" /></a>
      </div>
    </div>
    <p class="copyright"> &copy; Copyright Ping. All rights reserved.</p>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script href="index.js"></script>
</body>

</html>
